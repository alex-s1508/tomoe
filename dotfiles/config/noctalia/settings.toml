#  ╭─ ✦ Shell ────────────────────────────────────────────────────────────
[shell]
# Sobe o agente de autenticação do polkit junto com o shell.
polkit_agent = true

    # Mantém o wallpaper, as cores e o layout sincronizados com o greeter.
    [shell.greeter_sync]
    auto_sync = true

#  ╭─ ✦ Tema ─────────────────────────────────────────────────────────────
# Paleta monocromática gerada a partir do wallpaper.
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

#  ╭─ ✦ Wallpaper ────────────────────────────────────────────────────────
# O instalador troca __WALLPAPER__ pelo caminho localizado em
# XDG_PICTURES_DIR/Wallpapers.
[wallpaper.default]
path = "__WALLPAPER__"
