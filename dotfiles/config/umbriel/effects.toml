#  ║  ✦ Effects                                                          ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ Presets ──────────────────────────────────────────────────────────
# No effect is active until a preset is included and selected by name in [effects].
# Include the pulse effect for the pulsing border; add cursor trail and audio-reactive border includes as needed. Audio-reactive mode needs the Noctalia provider and 64 bands; Umbriel does not capture audio.
#
#  ╭─ ✦ Pools ────────────────────────────────────────────────────────────
# Pools accept predefined or separately included presets. This example
# member uses the pulse preset; add other names to choose.
#
# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "first_unused" # or round_robin, random
# Select with border = "borders" in the [effects] table.

#  ╭─ ✦ Keybinds ──────────────────────────────────────────────────────────
# Add to the [keybinds] table:
# "Mod+Shift+E" = "effect-border-cycle borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"

#  ╭─ ✦ Selection ──────────────────────────────────────────────────────────
# [effects]
# border = "pulse"
# cursor = "trail"
