#
#  ╔═════════════════════════════════════════════════════════════════════╗
#  ║  ✦ Animations                                                        ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ General ────────────────────────────────────────────────────────────
[animation]
enabled = true
duration_ms = 250

#  ╭─ ✦ Windows ──────────────────────────────────────────────────────────
[animation.windows_in]
style = "popin"
scale = 0.5

[animation.windows_out]
style = "popin"
scale = 0.8

# Window-rule opacity and blur fade by default when focus changes.
[animation.windows_opacity]
enabled = true
# curve = "spring:1,900"
# duration_ms = 250 # For curves without spring; the spring sets its own duration.

#  ╭─ ✦ Workspaces ───────────────────────────────────────────────────────
[animation.workspaces]
style = "slide"

# Live workspace reveal (see docs/user/animation.md): include workspace_wipe effect.
# [animation.workspaces]
# style = "reveal"
# effect = "workspace_wipe"

#  ╭─ ✦ Dialogs ─────────────────────────────────────────────────────────
# Shadow over the window while a modal dialog is attached.
# [animation.dialogs]
# dim = 0.3
