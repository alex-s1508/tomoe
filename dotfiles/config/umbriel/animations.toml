#
#  ╔═════════════════════════════════════════════════════════════════════╗
#  ║  ✦ Animações                                                        ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ Geral ────────────────────────────────────────────────────────────
[animation]
enabled = true
duration_ms = 250

#  ╭─ ✦ Janelas ──────────────────────────────────────────────────────────
[animation.windows_in]
style = "popin"
scale = 0.5

[animation.windows_out]
style = "popin"
scale = 0.8

# Opacidade e blur das regras de janela esmaecem ao mudar o foco por padrão.
[animation.windows_opacity]
enabled = true
# curve = "spring:1,900"
# duration_ms = 250 # Para curvas sem spring; o spring define a própria duração.

#  ╭─ ✦ Workspaces ───────────────────────────────────────────────────────
[animation.workspaces]
style = "slide"

# Revelação ao vivo do workspace (veja docs/user/animation.md).
# Inclua o effects/animation/workspace_wipe/effect.toml.
# [animation.workspaces]
# style = "reveal"
# effect = "workspace_wipe"
# duration_ms = 300
# curve = "easeout"

#  ╭─ ✦ Diálogos ─────────────────────────────────────────────────────────
# Sombra sobre a janela enquanto um diálogo modal está anexado.
# [animation.dialogs]
# dim = 0.3
