#
#  ╔═════════════════════════════════════════════════════════════════════╗
#  ║  ✦ Appearance                                                        ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ General ────────────────────────────────────────────────────────────
[appearance]
corner_radius = 8
border_width = 1
# button_size = 28

[appearance.blur]
radius = 3

#  ╭─ ✦ Shadow ───────────────────────────────────────────────────────────
[appearance.shadow]
enabled = true

#  ╭─ ✦ Title bar ──────────────────────────────────────────────────
# Optional title bar, with drag and resize without a modifier.
# mode: "on" follows the client preference, "negotiated" hides it in Wayland
# windows without negotiation, "forced" always shows it and "off" hides it.
[appearance.title_bar]
mode = "off"
height = 28
font = "sans 10"
button_position = "right"
buttons = ["minimize", "maximize", "close"]
# -1 follows the window corner_radius; 0 makes the buttons square.
# button_corner_radius = -1
# "always", "hover" (on hover or press) or "never".
button_glyph = "hover"
button_background = true

#  ╭─ ✦ Tab bar ────────────────────────────────────────────────────
[appearance.tab_bar]
position = "top"
height = 24
hide_when_single = false
max_tabs = 6
overflow = "scroll"
title_align = "center"
# style = "titles" # "indicator" draws thin slots without titles.
# gap = -1 # Space between bar and window; -1 follows layout.gap.
# font = "sans 10"
# visible = true # false hides the bars; tabs keep working.
# overflow = "scroll" # "shrink" resizes all tabs.