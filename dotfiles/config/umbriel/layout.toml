#
#  ╔═════════════════════════════════════════════════════════════════════╗
#  ║  ✦ Layout                                                           ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ General ────────────────────────────────────────────────────────────
# New windows in the scrolling layout start at half the output width.
# Stacked columns keep the focused row when leaving and returning.
[layout]
mode = "scrolling"
gap = 8
extent_presets = [0.333, 0.5, 0.667]
# Mod+F and top double-click fill the usable area without struts, gaps, or borders. "column" limits filling to that column.
client_maximize = "column"

#  ╭─ ✦ Stacking ─────────────────────────────────────────────────────
[layout.stacking]
# drop_zones = false # Disables drop zones on the edges when dragging.

#  ╭─ ✦ Scrolling ──────────────────────────────────────────────────────────
[layout.scrolling]
default_extent_fraction = 0.5
# Centers the chosen window in the overview, like column-center.
center_on_overview_select = true

#  ╭─ ✦ Tabs ─────────────────────────────────────────────────────────────
# A tab group shows one window at a time below a title bar. Mod+W groups adjacent stacked windows;
# Mod+Shift+J/K move tabs/windows. Click, scroll, or drag titles to switch, reorder, or close.
[layout.tabs]
default_display = "normal"
new_tab_position = "after_active"
middle_click_closes = true

