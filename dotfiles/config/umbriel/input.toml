#
#  ╔═════════════════════════════════════════════════════════════════════╗
#  ║  ✦ Input                                                          ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ Keyboard ──────────────────────────────────────────────────────────
# Layout and variant are adjusted by the installer for CachyOS.
[input.keyboard]
layout = "us"
variant = "intl"
numlock_toggle = true
repeat_delay = 300
repeat_rate = 50

#  ╭─ ✦ Touchpad ─────────────────────────────────────────────────────────
[input.touchpad]
tap = true
natural_scroll = true
disable_while_typing = true
# accel_profile = "flat" # Uncomment to remove touchpad acceleration.

#  ╭─ ✦ Mouse ────────────────────────────────────────────────────────────
# Removes acceleration: the pointer follows physical movement 1:1.
[input.mouse]
accel_profile = "flat"
# sensitivity = 0.0

#  ╭─ ✦ Focus ─────────────────────────────────────────────────────────────
# Focus follows the pointer between tiled, floating and pinned windows.
[input.focus]
follows_mouse = true
# hover_raises = false # Hover only focuses; clicks and shortcuts raise.

#  ╭─ ✦ Cursor ────────────────────────────────────────────────────────
[input.cursor]
theme = "Bibata-Modern-Classic"
size = 24
hardware_cursor = true

#  ╭─ ✦ Touch ────────────────────────────────────────────────────────────
# Restricts touch to one screen.
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"
