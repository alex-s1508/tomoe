#  ╭─ ✦ Saídas ───────────────────────────────────────────────────────────
# Saídas específicas da máquina. Ajuste conforme `umbriel outputs`.
# Monitor HDMI-A-1 (Principal à esquerda)
[output.HDMI-A-1]
mode = "1920x1080@180"
position = [0, 0]
scale = 1.0

# Monitor eDP-1 (Notebook à direita, com centros alinhados por uma linha horizontal)
[output.eDP-1]
mode = "1920x1080@120"
position = [1920, 108]
scale = 1.25
