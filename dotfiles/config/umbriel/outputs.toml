# Machine-specific outputs. Adjust them with `umbriel outputs`.
# Monitor HDMI-A-1 (primary, left)
[output.HDMI-A-1]
mode = "1920x1080@180"
position = [0, 0]
scale = 1.0

# Monitor eDP-1 (notebook on the right; centers aligned horizontally)
[output.eDP-1]
mode = "1920x1080@120"
position = [-1536, 86]
scale = 1.25
