#  ╭─ ✦ Session ───────────────────────────────────────────────────────────
[general]
# autostart = ["noctalia"]

#  ╭─ ✦ XWayland ─────────────────────────────────────────────────────────
xwayland = true
# X11 apps and games are sharp on scaled outputs.
xwayland_native_resolution = true
# Umbriel announces X11 scale and cursor via XSETTINGS.
# xwayland_xsettings = false
# Primary output for X11 games, using a name from `umbriel outputs`.
# xwayland_primary_output = "DP-1"

#  ╭─ ✦ Windows ──────────────────────────────────────────────────────────
# Unsynchronized NVIDIA outputs wait for the GPU by default.
# nvidia_sync_workaround = false
# Modal dialogs follow and stay attached to their parent window.
# attach_modal_dialogs = false
# Automatically focus a window when it is activated.
# focus_on_activate = false
