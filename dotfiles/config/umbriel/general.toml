#  ╭─ ✦ Sessão ───────────────────────────────────────────────────────────
[general]
# O autostart do Noctalia fica em noctalia.toml.
# autostart = ["noctalia"]

#  ╭─ ✦ XWayland ─────────────────────────────────────────────────────────
xwayland = true
# Apps e jogos X11 nítidos em saídas com escala.
xwayland_native_resolution = true
# O Umbriel anuncia escala e cursor X11 via XSETTINGS.
# xwayland_xsettings = false
# Monitor primário dos jogos X11, usando um nome de `umbriel outputs`.
# xwayland_primary_output = "DP-1"

#  ╭─ ✦ Janelas ──────────────────────────────────────────────────────────
# Saídas NVIDIA sem sincronização explícita esperam a GPU por padrão.
# nvidia_sync_workaround = false
# Diálogos modais acompanham e ficam presos à janela pai.
# attach_modal_dialogs = false
# Foco automático ao ativar uma janela.
# focus_on_activate = false
