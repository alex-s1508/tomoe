#
#  ╔═════════════════════════════════════════════════════════════════════╗
#  ║  ✦ Regras de janelas                                                ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ Geral ────────────────────────────────────────────────────────────
# Regras se combinam em ordem, com valores posteriores sobrepondo os anteriores.

# Desfoca janelas sobre o blur do wallpaper em cache. Use blur_optimized = false
# para incluir janelas sobrepostas atrás delas, com custo de GPU.
[[window_rule]]
blur = true

#  ╭─ ✦ Picture-in-Picture ───────────────────────────────────────────────
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

#  ╭─ ✦ Exemplos ─────────────────────────────────────────────────────────
# Mantém menus de jogos dentro da janela; um atalho de foco ou workspace solta o ponteiro.
# [[window_rule]]
# match.app_id = "^steam_app_.*$"
# confine_pointer = true

# Mantém atalhos do compositor disponíveis com uma janela de máquina virtual focada.
# [[window_rule]]
# match.app_id = "^virt-manager$"
# allow_shortcuts_inhibit = false

# Mantém um aplicativo desenhando enquanto oculto em outro workspace.
# [[window_rule]]
# match.app_id = "^obs$"
# background_render = true

# Mantém janelas visíveis localmente mas ausentes de capturas e gravações.
# [[window_rule]]
# match.app_id = "^private-app$"
# block_capture = true

# Mantém diálogos modais de um aplicativo como janelas comuns.
# [[window_rule]]
# match.app_id = "^gimp"
# match.is_dialog = true
# attach_to_parent = false

# Oculta barras de título ativas apenas com a janela maximizada nas bordas.
# [[window_rule]]
# match.is_maximized_to_edges = true
# title_bar = "off"

# Destaca a janela transmitida; os espectadores não veem a borda.
