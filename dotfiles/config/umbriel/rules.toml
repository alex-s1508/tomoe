#
#  ╔═════════════════════════════════════════════════════════════════════╗
#  ║  ✦ Window rules                                                ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ General ────────────────────────────────────────────────────────────
# Rules are applied in order; later values override earlier ones.

# Blurs windows over cached wallpaper blur. Use blur_optimized = false to include overlapping windows behind them (GPU cost).
[[window_rule]]
blur = true

#  ╭─ ✦ Picture-in-Picture ───────────────────────────────────────────────
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

