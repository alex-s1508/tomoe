#  ╭─ ✦ Geral ────────────────────────────────────────────────────────────
[overview]
zoom = 0.5
background_blur = true
workspace_wallpaper = true
shortcuts = true

#  ╭─ ✦ Cantos ativos ────────────────────────────────────────────────────
# O canto superior esquerdo abre o overview após um curto atraso.
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
