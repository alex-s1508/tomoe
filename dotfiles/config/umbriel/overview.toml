#  ╭─ ✦ General ────────────────────────────────────────────────────────────
[overview]
zoom = 0.5
background_blur = true
workspace_wallpaper = true
shortcuts = true

#  ╭─ ✦ Active corners ────────────────────────────────────────────────────
# The top-left corner opens the overview after a short delay.
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
