#  ╭─ ✦ Paleta ───────────────────────────────────────────────────────────
# Paleta monocromática preto e branco.
[colors]
accent_primary = "#FFFFFFFF"
accent_secondary = "#BFBFBFFF"
background = "#000000FF"
text_primary = "#E6E6E6FF"
text_muted = "#808080FF"
# Cor exibida se a tela de bloqueio demorar a aparecer.
# backdrop = "#000000FF"

#  ╭─ ✦ Bordas ───────────────────────────────────────────────────────────
[colors.border]
focused = "#FFFFFFFF"
unfocused = "#3A3A3AFF"
outer = "#141414FF"

#  ╭─ ✦ Barra de título ──────────────────────────────────────────────────
[colors.title_bar]
background = "#141414FF"
background_unfocused = "#0A0A0AFF"
text = "#FFFFFFFF"
text_unfocused = "#808080FF"
close = "#FFFFFFFF"
maximize = "#BFBFBFFF"
minimize = "#808080FF"

