#  ║  ✦ Colors                                                            ║
#  ╚═════════════════════════════════════════════════════════════════════╝

#  ╭─ ✦ Palette ───────────────────────────────────────────────────────────
# Monochrome black-and-white palette.
[colors]
accent_primary = "#FFFFFFFF"
accent_secondary = "#BFBFBFFF"
background = "#000000FF"
text_primary = "#E6E6E6FF"
text_muted = "#808080FF"
# Color shown if the lock screen takes time to appear.
# backdrop = "#000000FF"

#  ╭─ ✦ Borders ───────────────────────────────────────────────────────────
[colors.border]
focused = "#FFFFFFFF"
unfocused = "#3A3A3AFF"
outer = "#141414FF"

#  ╭─ ✦ Title bar ──────────────────────────────────────────────────
[colors.title_bar]
background = "#141414FF"
background_unfocused = "#0A0A0AFF"
text = "#FFFFFFFF"
text_unfocused = "#808080FF"
close = "#FFFFFFFF"
maximize = "#BFBFBFFF"
minimize = "#808080FF"

#  ╭─ ✦ Buttons ───────────────────────────────────────────────────────────
# Optional button palette. Glyph colors apply even without a background.
# close_glyph = "#000000FF"
# close_glyph_hover = "#000000FF"
# maximize_glyph = "#000000FF"
# maximize_glyph_hover = "#000000FF"
# minimize_glyph = "#000000FF"
