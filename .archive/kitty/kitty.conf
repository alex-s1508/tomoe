#
# ============================================================================
#                               TERMINAL (KITTY)                              
# ============================================================================
# Arquivo: ~/.config/kitty/kitty.conf
# Descrição: Terminal padrão da dotfile Tomoe.
# ==============================================================================

# ------------------------------------------------------------------------------
# Tipografia & fontes
# ------------------------------------------------------------------------------
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ------------------------------------------------------------------------------
# Janela & layout
# ------------------------------------------------------------------------------
window_padding_width     12
background_opacity       0.85
dynamic_background_opacity yes
confirm_os_window_close  0

# ------------------------------------------------------------------------------
# Cursor & rolagem
# ------------------------------------------------------------------------------
cursor_shape          beam
cursor_blink_interval 0.5
scrollback_lines      10000

# ------------------------------------------------------------------------------
# Paleta de cores (Tomoe / Chie Dark)
# ------------------------------------------------------------------------------
foreground            #E6E6E6
background            #0F1012
selection_foreground  #0F1012
selection_background  #F6E05E

color0   #1F232A
color1   #E06C75
color2   #98C379
color3   #E5C07B
color4   #61AFEF
color5   #C678DD
color6   #56B6C2
color7   #ABB2BF

color8   #5C6370
color9   #BE5046
color10  #A4E57E
color11  #F1D38A
color12  #70B8FF
color13  #D699FF
color14  #6DE0ED
color15  #FFFFFF
